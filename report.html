<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI · Quantum · Photonics Supply Chain — Report</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { font: 15px/1.55 -apple-system, Segoe UI, Roboto, sans-serif; max-width: 920px; margin: 24px auto; padding: 0 20px 80px; background: #0e1116; color: #e3e7ed; }
  h1, h2, h3, h4 { color: #e3e7ed; margin-top: 28px; line-height: 1.25; }
  h1 { font-size: 26px; border-bottom: 1px solid #2a2f38; padding-bottom: 8px; }
  h2 { font-size: 20px; color: #8ab4f8; border-bottom: 1px solid #1d2129; padding-bottom: 4px; }
  h3 { font-size: 16px; color: #c5cad3; }
  h4 { font-size: 14px; color: #97a3b6; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13px; }
  th, td { padding: 6px 10px; border-bottom: 1px solid #2a2f38; text-align: left; }
  th { color: #97a3b6; font-weight: 600; background: #15171c; }
  tr:hover td { background: #15171c; }
  a { color: #8ab4f8; }
  a:hover { color: #b1ceff; }
  code { background: #1d2129; padding: 2px 6px; border-radius: 3px; font: 12px/1.4 Consolas, Monaco, monospace; }
  pre { background: #0a0d12; padding: 14px; border: 1px solid #2a2f38; border-radius: 4px; overflow-x: auto; font: 12px/1.45 Consolas, Monaco, monospace; }
  pre code { background: transparent; padding: 0; }
  blockquote { border-left: 3px solid #3a4150; margin: 12px 0; padding: 4px 14px; color: #97a3b6; }
  ul, ol { padding-left: 24px; }
  hr { border: 0; border-top: 1px solid #2a2f38; margin: 20px 0; }
  .nav { color: #7a8395; font-size: 12px; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #2a2f38; }
  .nav a { margin-right: 16px; }
  .loading { color: #7a8395; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="nav">
  <a href="/">← Interactive supply-chain viewer</a>
  <a href="https://github.com/michaltalaga/ai-supply-chain" target="_blank" rel="noopener">Repo</a>
  <a href="/tickers.csv">tickers.csv</a>
  <a href="/financials.csv">financials.csv</a>
  <a href="/prices_monthly.csv">prices_monthly.csv</a>
  <a href="/REPORT.md">Raw markdown</a>
</div>
<div id="content"><p class="loading">Loading report…</p></div>

<script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
<script>
  marked.setOptions({ gfm: true, breaks: false });
  fetch('REPORT.md', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(t => {
      const html = marked.parse(t);
      document.getElementById('content').innerHTML = html;
      document.title = (document.querySelector('h1')?.innerText || 'Supply Chain Report');
    })
    .catch(err => {
      document.getElementById('content').innerHTML =
        '<p style="color:#f08080">Failed to load REPORT.md: ' + err.message + '</p>' +
        '<p>Try the <a href="/REPORT.md">raw file</a> or the <a href="https://github.com/michaltalaga/ai-supply-chain/blob/main/REPORT.md">GitHub-rendered version</a>.</p>';
    });
</script>
</body>
</html>
